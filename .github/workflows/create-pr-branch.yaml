---
name: Create Pull Request Branch
run-name: Create Pull Request Branch (${{inputs.pr}})
on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull Request Number"
        required: true
      is_comment:
        description: Whether a comment is posted
        type: boolean
        required: true
jobs:
  create-pr-branch:
    uses: suzuki-shunsuke/js-action-release-workflow/.github/workflows/release.yaml@8be0b473dc9410a79482fad9e42fdf52d10118a3 # v0.0.4
    permissions:
      contents: write
      pull-requests: write
      issues: write
      # js-action-release-workflow requests id-token: write, and a called workflow
      # can't be granted more than its caller has.
      id-token: write
    with:
      version: pr/${{inputs.pr}}
      pr: ${{fromJSON(inputs.pr)}}
      is_comment: ${{inputs.is_comment}}
    secrets:
      TAKUMI_GUARD_BOT_ID: ${{secrets.TAKUMI_GUARD_BOT_ID}}
